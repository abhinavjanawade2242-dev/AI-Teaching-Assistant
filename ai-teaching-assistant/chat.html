<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - EduAI</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="logo-icon">🎓</span>
            <span>EduAI</span>
        </a>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="chat.html" class="active">AI Tutor</a>
            <a href="quiz.html">Quizzes</a>
            <a href="resources.html">Resources</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <!-- Chat Container -->
    <div class="chat-container">
        <!-- Chat Header -->
        <div class="chat-header">
            <h2>🤖 AI Teaching Assistant</h2>
            <div class="chat-controls">
                <select id="chatGrade" aria-label="Select grade level">
                    <option value="primary">Primary (K-5)</option>
                    <option value="middle" selected>Middle (6-8)</option>
                    <option value="high">High School (9-12)</option>
                </select>
                <select id="chatSubject" aria-label="Select subject">
                    <option value="math">Mathematics</option>
                    <option value="science">Science</option>
                    <option value="english">English</option>
                    <option value="history">History</option>
                </select>
            </div>
        </div>

        <!-- Topic Suggestions -->
        <div class="topic-suggestions" id="topicSuggestions">
            <button class="topic-btn" onclick="sendTopic(this)">What are fractions?</button>
            <button class="topic-btn" onclick="sendTopic(this)">Explain photosynthesis</button>
            <button class="topic-btn" onclick="sendTopic(this)">Help with algebra</button>
            <button class="topic-btn" onclick="sendTopic(this)">Parts of speech</button>
            <button class="topic-btn" onclick="sendTopic(this)">Solar system facts</button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-avatar">🤖</div>
                <div class="message-bubble">
                    Hello! I'm your AI Teaching Assistant. 👋 I can help you learn about any subject at your grade level. Just ask me a question or pick a topic above to get started!
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ask me anything..." aria-label="Type your message" onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">Send ➤</button>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { requireLogin(); });
    </script>
</body>
</html>
