<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduAI</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <span class="logo-icon">🎓</span>
            <span>EduAI</span>
        </a>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <!-- Login Section -->
    <div class="auth-container">
        <div class="auth-card" id="loginCard">
            <div class="auth-header">
                <span class="auth-icon">🎓</span>
                <h2>Welcome to EduAI</h2>
                <p>Sign in to your account</p>
            </div>

            <!-- Role Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('student')" id="tabStudent">👨‍🎓 Student</button>
                <button class="auth-tab" onclick="switchTab('teacher')" id="tabTeacher">👩‍🏫 Teacher</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="loginPassword" placeholder="Enter your password" required style="padding-right: 3rem;">
                        <button type="button" onclick="togglePassword('loginPassword', 'loginToggleIcon')" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-light); padding: 0.25rem;" aria-label="Toggle password visibility">
                            <span id="loginToggleIcon">👁️</span>
                        </button>
                    </div>
                </div>
                <div class="form-error" id="loginError"></div>
                <button type="submit" class="btn btn-accent auth-submit-btn">Sign In</button>
            </form>

            <div class="auth-footer" id="registerPrompt" style="display: none;">
                <p>Don't have an account? <a href="#" onclick="showRegister(event)">Register as Teacher</a></p>
            </div>

        </div>

        <!-- Register Form (Teachers only) -->
        <div class="auth-card" id="registerCard" style="display: none;">
            <div class="auth-header">
                <span class="auth-icon">👩‍🏫</span>
                <h2>Teacher Registration</h2>
                <p>Create a new teacher account</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="regPassword" placeholder="Choose a password" required minlength="6" style="padding-right: 3rem;">
                        <button type="button" onclick="togglePassword('regPassword', 'regToggleIcon')" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-light); padding: 0.25rem;" aria-label="Toggle password visibility">
                            <span id="regToggleIcon">👁️</span>
                        </button>
                    </div>
                </div>
                <div class="form-error" id="registerError"></div>
                <button type="submit" class="btn btn-accent auth-submit-btn">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="#" onclick="showLogin(event)">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        let selectedRole = 'student';

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🚫'; // Crossed eye
            } else {
                input.type = 'password';
                icon.textContent = '👁️'; // Eye
            }
        }

        function switchTab(role) {
            selectedRole = role;
            document.getElementById('tabStudent').classList.toggle('active', role === 'student');
            document.getElementById('tabTeacher').classList.toggle('active', role === 'teacher');
            // Show register option only for teachers
            const registerPrompt = document.getElementById('registerPrompt');
            if (registerPrompt) {
                registerPrompt.style.display = role === 'teacher' ? 'block' : 'none';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            const result = login(username, password);
            if (result.success) {
                // Verify role matches selected tab
                if (result.user.role !== selectedRole) {
                    errorEl.textContent = `This account is a ${result.user.role} account. Please select the correct role tab.`;
                    localStorage.removeItem('eduai_session');
                    return;
                }
                window.location.href = 'dashboard.html';
            } else {
                errorEl.textContent = result.message;
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorEl = document.getElementById('registerError');

            if (password.length < 6) {
                errorEl.textContent = 'Password must be at least 6 characters.';
                return;
            }

            const result = registerTeacher(username, password, name, email);
            if (result.success) {
                // Auto-login
                login(username, password);
                window.location.href = 'dashboard.html';
            } else {
                errorEl.textContent = result.message;
            }
        }

        function showRegister(e) {
            e.preventDefault();
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('registerCard').style.display = 'block';
        }

        function showLogin(e) {
            e.preventDefault();
            document.getElementById('registerCard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
        }
    </script>
</body>
</html>
